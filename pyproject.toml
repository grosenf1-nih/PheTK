[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PheTK"
version = "0.1.0"
description = "Phenome-wide association study (PheWAS) toolkit"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "adjusttext",
    "connectorx",
    "google-cloud-bigquery",
    "hail",
    "lxml",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "statsmodels",
    "tqdm",
    "setuptools",
    "firthlogist"
]
requires-python = ">=3.7"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.10",
    "pytest-mock>=3.6",
    "coverage>=5.0",
    "mock>=4.0"
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10", 
    "pytest-mock>=3.6",
    "coverage>=5.0",
    "mock>=4.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.900"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src/PheTK --cov-report=html --cov-report=term-missing --verbose"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
